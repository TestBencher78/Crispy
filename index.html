<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08312A">
  <title>Crispy</title>
  <style>
    :root{color-scheme:dark;--bg:#08312A;--card:#0D4037;--text:#fff;--muted:#C7DDD6;--accent:#00E47C;--accent2:#39F29B}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text)}body{min-height:100svh;overflow:hidden}
    .screen{display:none;min-height:100svh;padding:clamp(20px,5vw,56px);align-items:center;justify-content:center}.screen.active{display:flex;animation:fade .28s ease}
    .card{width:min(920px,100%);text-align:center;background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.14);border-radius:30px;padding:clamp(26px,6vw,62px);box-shadow:0 26px 80px rgba(0,0,0,.35)}
    .logo{width:82px;height:82px;margin:0 auto 18px;display:grid;place-items:center;border-radius:24px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#08312A;font-size:40px;font-weight:900;box-shadow:0 14px 40px rgba(0,228,124,.28)}
    h1{margin:0;font-size:clamp(48px,11vw,96px);letter-spacing:-.055em}h2{margin:0 0 10px;font-size:clamp(28px,6vw,50px)}p{color:var(--muted);font-size:clamp(17px,3vw,23px);line-height:1.45;margin:12px auto 28px}
    .eyebrow{margin-bottom:12px;color:var(--accent);font-size:14px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
    button{min-width:190px;min-height:62px;border:0;border-radius:18px;padding:16px 28px;color:#08312A;background:linear-gradient(135deg,var(--accent),var(--accent2));font-size:20px;font-weight:800;cursor:pointer;box-shadow:0 12px 30px rgba(0,228,124,.24)}button:active{transform:scale(.98)}button:focus-visible{outline:4px solid white;outline-offset:4px}
    video{display:block;width:100%;max-height:52svh;margin:20px auto 24px;border-radius:20px;background:#000;object-fit:contain}.status{min-height:24px;margin:-12px 0 18px;color:#7CFFBD;font-size:15px}
    .check{width:90px;height:90px;margin:0 auto 22px;display:grid;place-items:center;border-radius:50%;background:var(--accent);color:#08312A;font-size:52px;font-weight:900}.progress{width:100%;height:7px;margin-bottom:24px;overflow:hidden;border-radius:99px;background:rgba(255,255,255,.1)}.progress span{display:block;width:66%;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
    @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(max-height:520px){.screen{padding:14px}.card{padding:18px 24px}video{max-height:42svh;margin:10px auto 14px}h2{font-size:28px}p{margin:8px auto 14px}button{min-height:54px}}
  </style>
</head>
<body>
<main>
<section id="start" class="screen active"><div class="card"><div class="logo">C</div><div class="eyebrow">Training Experience</div><h1>Crispy</h1><p>Kurze Lektionen. Direkt im Blick.</p><button onclick="startLesson()">Starten</button></div></section>
<section id="lesson" class="screen"><div class="card"><div class="progress"><span></span></div><div class="eyebrow">Lektion 1 von 1</div><h2>Produktionsschritt</h2><video id="lessonVideo" controls playsinline webkit-playsinline preload="auto" muted><source src="./assets/lektion.mp4" type="video/mp4">Dein Browser unterstützt dieses Video nicht.</video><div id="videoStatus" class="status"></div><button onclick="finishLesson()">Weiter</button></div></section>
<section id="done" class="screen"><div class="card"><div class="check">✓</div><div class="eyebrow">100 % abgeschlossen</div><h2>Lektion abgeschlossen</h2><p>Sehr gut. Du hast die Crispy-Demo erfolgreich beendet.</p><button onclick="restartLesson()">Neu starten</button></div></section>
</main>
<script>
const video=document.getElementById('lessonVideo'),statusText=document.getElementById('videoStatus');
function showScreen(id){document.querySelectorAll('.screen').forEach(el=>el.classList.remove('active'));document.getElementById(id).classList.add('active')}
async function startLesson(){showScreen('lesson');video.currentTime=0;try{await video.play();statusText.textContent=''}catch(e){statusText.textContent='Zum Abspielen bitte das Video auswählen.'}}
function finishLesson(){video.pause();showScreen('done')}function restartLesson(){video.pause();video.currentTime=0;showScreen('start')}
video.addEventListener('error',()=>statusText.textContent='Video nicht gefunden. Prüfe den Pfad ./assets/lektion.mp4.');
</script>
</body>
</html>
